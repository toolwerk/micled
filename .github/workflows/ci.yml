name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: cargo test --workspace
      # Mikrofon-Abfrage gegen das echte CoreAudio (Runner hat kein Mikro, Liste ist leer)
      - run: cargo run -p micled-cli -- mic
      - run: cargo build -p micled-ffi --release --target x86_64-apple-darwin
