# Xcode-Projekt wird mit `xcodegen generate` erzeugt, .xcodeproj nicht einchecken.
name: MicLED
options:
  bundleIdPrefix: net.staude
  deploymentTarget:
    macOS: "14.0"   # CoreAudio-Prozessobjekte für die Mikrofon-Erkennung gibt es ab macOS 14
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7N2W4T6UPV"

# Updates der App außerhalb des App Stores (Sources/UpdaterController.swift)
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"

# Eigenes Target statt Pre-Build-Skript: Als Abhängigkeit ist der Rust-Build
# fertig, bevor die App kompiliert. Bibliothek und Header werden direkt
# eingebunden, nicht als XCFramework: Xcode kopiert ein XCFramework nach einem
# Stand, den es vor dem Rust-Build ermittelt, und baut dann gegen alte Header.
aggregateTargets:
  RustCore:
    buildScripts:
      - name: Rust-Kern und Swift-Bindings bauen
        script: '"${SRCROOT}/../../scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO   # Skript schreibt nach build/ und Generated/

targets:
  MicLED:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Generated         # von scripts/build-rust.sh erzeugt, nicht eingecheckt
        optional: true
        createIntermediateGroups: false
      - path: Resources/Assets.xcassets
    dependencies:
      - target: RustCore
      - package: Sparkle
      - framework: ../../build/universal/libmicled_ffi.a   # als Eingabe des Linkers verfolgt
        embed: false
      - sdk: CoreAudio.framework
      - sdk: CoreMediaIO.framework
      - sdk: EventKit.framework
      - sdk: AppIntents.framework
      - sdk: Intents.framework
      - sdk: CoreFoundation.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: MicLED
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.micled
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/MicLED.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        # Explizite Module merken nicht, dass RustCore den UniFFI-Header neu schreibt
        # („has been modified since the module file was built“). Implizite Module
        # prüfen den Header bei jedem Build.
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../build/include   # module.modulemap + micled_ffiFFI.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../build/universal
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
